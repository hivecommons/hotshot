name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift-build:
    name: Swift build (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: swift test --enable-code-coverage
      - name: Coverage report
        run: |
          BIN="$(swift build --show-bin-path)"
          PROF="$BIN/codecov/default.profdata"
          XCT="$(find "$BIN" -name '*.xctest' -maxdepth 1 | head -1)"
          xcrun llvm-cov report "$XCT/Contents/MacOS/$(basename "$XCT" .xctest)" \
            -instr-profile "$PROF" \
            -ignore-filename-regex 'Tests/|\.derived/' | tee coverage.txt
      - name: Coverage gate (per-module line floors)
        run: |
          BIN="$(swift build --show-bin-path)"
          PROF="$BIN/codecov/default.profdata"
          XCT="$(find "$BIN" -name '*.xctest' -maxdepth 1 | head -1)"
          xcrun llvm-cov export "$XCT/Contents/MacOS/$(basename "$XCT" .xctest)" \
            -instr-profile "$PROF" \
            -ignore-filename-regex 'Tests/|\.derived/' \
            -summary-only > coverage.json
          python3 - <<'PY'
          import json, sys

          # module -> line-coverage floor. Add a line here when a new library
          # target joins the test bundle. HotshotApp starts at a conservative
          # 60: its first suite (#106) covers the pasteboard/watcher/injector
          # branches but not the AppleScript and DispatchSource paths, so the
          # floor is raised once CI prints a measured figure.
          floors = {"HotshotCore": 90, "HotshotApp": 60}

          data = json.load(open("coverage.json"))["data"][0]
          totals = {}
          for f in data["files"]:
              parts = f["filename"].split("/Sources/", 1)
              if len(parts) < 2:
                  continue
              mod = parts[1].split("/", 1)[0]
              covered = f["summary"]["lines"]["covered"]
              count = f["summary"]["lines"]["count"]
              c, n = totals.get(mod, (0, 0))
              totals[mod] = (c + covered, n + count)

          failed = False
          for mod, (c, n) in sorted(totals.items()):
              pct = round(100.0 * c / n, 2) if n else 0.0
              floor = floors.get(mod)
              label = f" floor {floor}%" if floor is not None else " (unfloored)"
              print(f"{mod}: {pct}% ({c}/{n} lines)" + label)
              if floor is not None and pct < floor:
                  print(f"::error::{mod} line coverage {pct}% is below the {floor}% floor")
                  failed = True
          for mod in floors:
              if mod not in totals:
                  print(f"::error::module {mod} not present in coverage export")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

  shellcheck:
    name: ShellCheck (Linux scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -S warning linux/hotshot-capture.sh linux/install.sh linux/tests/hotshot-capture.test.sh linux/tests/install.test.sh scripts/bundle.sh scripts/tests/bundle.test.sh

  shell-tests:
    name: Linux capture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Linux capture tests
        run: bash linux/tests/hotshot-capture.test.sh
      - name: Run Linux installer tests
        run: bash linux/tests/install.test.sh
      - name: Run bundle script tests
        run: bash scripts/tests/bundle.test.sh

  powershell-analyze:
    name: PSScriptAnalyzer (Windows scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path windows -Recurse -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }

  pester:
    name: Pester (Windows script unit tests)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Pester tests
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 6.2.0 -Force -Scope CurrentUser
          Invoke-Pester -Path windows/tests -CI
