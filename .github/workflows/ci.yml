name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift-build:
    name: Swift build (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: swift test --enable-code-coverage
      - name: Coverage report
        run: |
          BIN="$(swift build --show-bin-path)"
          PROF="$BIN/codecov/default.profdata"
          XCT="$(find "$BIN" -name '*.xctest' -maxdepth 1 | head -1)"
          xcrun llvm-cov report "$XCT/Contents/MacOS/$(basename "$XCT" .xctest)" \
            -instr-profile "$PROF" \
            -ignore-filename-regex 'Tests/|\.derived/' | tee coverage.txt
      - name: Coverage gate (per-module line floors)
        run: |
          BIN="$(swift build --show-bin-path)"
          PROF="$BIN/codecov/default.profdata"
          XCT="$(find "$BIN" -name '*.xctest' -maxdepth 1 | head -1)"
          xcrun llvm-cov export "$XCT/Contents/MacOS/$(basename "$XCT" .xctest)" \
            -instr-profile "$PROF" \
            -ignore-filename-regex 'Tests/|\.derived/' \
            -summary-only > coverage.json
          python3 - <<'PY'
          import json, sys

          # module -> line-coverage floor. Add a line here when a new library
          # target joins the test bundle. Floors sit a few points under the
          # figure CI last measured on main (HotshotCore 98.2%, HotshotApp
          # 98.0% at #170); raise them again when a PR lifts coverage.
          floors = {"HotshotCore": 95, "HotshotApp": 95}

          data = json.load(open("coverage.json"))["data"][0]
          totals = {}
          for f in data["files"]:
              parts = f["filename"].split("/Sources/", 1)
              if len(parts) < 2:
                  continue
              mod = parts[1].split("/", 1)[0]
              covered = f["summary"]["lines"]["covered"]
              count = f["summary"]["lines"]["count"]
              c, n = totals.get(mod, (0, 0))
              totals[mod] = (c + covered, n + count)

          failed = False
          for mod, (c, n) in sorted(totals.items()):
              pct = round(100.0 * c / n, 2) if n else 0.0
              floor = floors.get(mod)
              label = f" floor {floor}%" if floor is not None else " (unfloored)"
              print(f"{mod}: {pct}% ({c}/{n} lines)" + label)
              if floor is not None and pct < floor:
                  print(f"::error::{mod} line coverage {pct}% is below the {floor}% floor")
                  failed = True
          for mod in floors:
              if mod not in totals:
                  print(f"::error::module {mod} not present in coverage export")
                  failed = True
          sys.exit(1 if failed else 0)
          PY
      - name: Release build + app bundle
        run: bash scripts/bundle.sh
      - name: Validate bundle contents
        run: |
          test -x Hotshot.app/Contents/MacOS/hotshot
          test -f Hotshot.app/Contents/Resources/AppIcon.icns
          plutil -lint Hotshot.app/Contents/Info.plist

  shellcheck:
    name: ShellCheck (Linux scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -S warning linux/hotshot-capture.sh linux/install.sh linux/tests/hotshot-capture.test.sh linux/tests/install.test.sh scripts/bundle.sh scripts/tests/bundle.test.sh scripts/shell-coverage.sh

  shell-tests:
    name: Linux capture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shell suites with line coverage
        run: bash scripts/shell-coverage.sh

  powershell-analyze:
    name: PSScriptAnalyzer (Windows scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $attempt = 0
          do {
            $attempt++
            try {
              Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -ErrorAction Stop
              break
            } catch {
              # PowerShellGet v2 intermittently reports "No match was found"
              # for a published version; PSResourceGet queries the gallery
              # through a different client, so try it before sleeping.
              try {
                Install-PSResource PSScriptAnalyzer -Version 1.25.0 -TrustRepository -Scope CurrentUser -Reinstall -ErrorAction Stop
                break
              } catch {
                Write-Warning "Install-PSResource fallback failed: $($_.Exception.Message)"
              }
              if ($attempt -ge 3) { throw }
              Write-Warning "Install-Module attempt $attempt failed: $($_.Exception.Message); retrying in $(10 * $attempt)s"
              Start-Sleep -Seconds (10 * $attempt)
            }
          } while ($true)
          $r = Invoke-ScriptAnalyzer -Path windows -Recurse -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }

  pester:
    name: Pester (Windows script unit tests)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Pester tests
        shell: pwsh
        run: |
          $attempt = 0
          do {
            $attempt++
            try {
              Install-Module Pester -RequiredVersion 6.2.0 -Force -Scope CurrentUser -ErrorAction Stop
              break
            } catch {
              # PowerShellGet v2 intermittently reports "No match was found"
              # for a published version; PSResourceGet queries the gallery
              # through a different client, so try it before sleeping.
              try {
                Install-PSResource Pester -Version 6.2.0 -TrustRepository -Scope CurrentUser -Reinstall -ErrorAction Stop
                break
              } catch {
                Write-Warning "Install-PSResource fallback failed: $($_.Exception.Message)"
              }
              if ($attempt -ge 3) { throw }
              Write-Warning "Install-Module attempt $attempt failed: $($_.Exception.Message); retrying in $(10 * $attempt)s"
              Start-Sleep -Seconds (10 * $attempt)
            }
          } while ($true)
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'windows/tests'
          $cfg.Run.Exit = $true
          $cfg.TestResult.Enabled = $true
          $cfg.Output.Verbosity = 'Detailed'
          # Only in-process code is measurable: install.ps1 runs in a child
          # pwsh and hotshot-capture.ps1 is never executed by the suite.
          $cfg.CodeCoverage.Enabled = $true
          $cfg.CodeCoverage.Path = @('windows/HotshotCapture.psm1')
          $cfg.CodeCoverage.OutputPath = 'coverage-pester.xml'
          # Floor sits a few points under the figure CI measures on main;
          # raise it when a PR lifts coverage (same policy as the Swift floors).
          $cfg.CodeCoverage.CoveragePercentTarget = 88
          Invoke-Pester -Configuration $cfg
      - name: Upload Pester coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pester-coverage
          path: coverage-pester.xml
          if-no-files-found: warn
