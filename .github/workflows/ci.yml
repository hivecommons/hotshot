name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift-build:
    name: Swift build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: swift test --enable-code-coverage
      - name: Coverage report
        run: |
          BIN="$(swift build --show-bin-path)"
          PROF="$BIN/codecov/default.profdata"
          XCT="$(find "$BIN" -name '*.xctest' -maxdepth 1 | head -1)"
          xcrun llvm-cov report "$XCT/Contents/MacOS/$(basename "$XCT" .xctest)" \
            -instr-profile "$PROF" \
            -ignore-filename-regex 'Tests/' | tee coverage.txt
      - name: Coverage gate (HotshotCore lines >= 90%)
        run: |
          BIN="$(swift build --show-bin-path)"
          PROF="$BIN/codecov/default.profdata"
          XCT="$(find "$BIN" -name '*.xctest' -maxdepth 1 | head -1)"
          PCT="$(xcrun llvm-cov export "$XCT/Contents/MacOS/$(basename "$XCT" .xctest)" \
            -instr-profile "$PROF" \
            -ignore-filename-regex 'Tests/' \
            -summary-only \
            | python3 -c 'import json,sys; print(round(json.load(sys.stdin)["data"][0]["totals"]["lines"]["percent"], 2))')"
          echo "HotshotCore line coverage: ${PCT}% (floor 90%)"
          if ! python3 -c "import sys; sys.exit(0 if float('${PCT}') >= 90 else 1)"; then
            echo "::error::HotshotCore line coverage ${PCT}% is below the 90% floor"
            exit 1
          fi

  shellcheck:
    name: ShellCheck (Linux scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -S warning linux/hotshot-capture.sh linux/install.sh linux/tests/hotshot-capture.test.sh linux/tests/install.test.sh scripts/bundle.sh scripts/tests/bundle.test.sh

  shell-tests:
    name: Linux capture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Linux capture tests
        run: bash linux/tests/hotshot-capture.test.sh
      - name: Run Linux installer tests
        run: bash linux/tests/install.test.sh
      - name: Run bundle script tests
        run: bash scripts/tests/bundle.test.sh

  powershell-analyze:
    name: PSScriptAnalyzer (Windows scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path windows -Recurse -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }

  pester:
    name: Pester (Windows script unit tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Pester tests
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser
          Invoke-Pester -Path windows/tests -CI
